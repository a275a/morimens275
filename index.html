<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>망각전야 랜덤 팀 편성기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Orbitron:wght@500&display=swap');
        
        :root {
            --chaos: #ffd700; --deep: #00f2ff; --blood: #ff3c3c; --hyper: #da70d6;
            --ssr: #ff8c00; --sr: #c0c0c0;
            --atk: #ff4444; --def: #4488ff; --sup: #44ff88;
            /* 체스 고유 역할군 색상 */
            --c-guard: #00e5ff; --c-struggle: #ff4d4d; --c-territory: #bf80ff; --c-star: #ff66cc; --c-bless: #66ff66;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: url('망각전야이미지폴더/image_dec78e.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); z-index: -1;
        }

        header { text-align: center; padding: 30px 20px; }
        .logo { max-width: 280px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }

        .container { width: 95%; max-width: 1100px; padding: 10px; margin-bottom: 50px; }

        .control-panel {
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .settings-row { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 25px; }
        .setting-group { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px solid #333; flex: 1; min-width: 300px; }
        .setting-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; color: var(--chaos); display: block; }

        .mode-selector, .style-selector { display: flex; gap: 10px; flex-wrap: wrap; }
        .mode-selector label, .style-selector label {
            cursor: pointer; padding: 10px 15px; background: #222; border: 1px solid #444;
            border-radius: 8px; transition: 0.3s; font-size: 0.85rem; flex: 1; text-align: center; min-width: 80px;
        }
        .mode-selector input, .style-selector input { display: none; }
        .mode-selector label:has(input:checked), .style-selector label:has(input:checked) { 
            border-color: var(--chaos); background: rgba(255,215,0,0.15); color: var(--chaos); font-weight: bold;
        }

        .faction-accordion { margin-bottom: 15px; border-radius: 12px; overflow: hidden; border: 1px solid #444; }
        .faction-header {
            background: #1a1a1e; padding: 15px 25px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
        }
        .faction-header:hover { background: #25252b; }
        .faction-info { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; font-weight: bold; }
        .faction-icon-small { width: 28px; height: 28px; }

        .btn-toggle-group { display: flex; gap: 10px; }
        .btn-toggle { 
            background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid #666; 
            padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: 0.2s;
        }
        .btn-on { border-color: currentColor; background: rgba(255,255,255,0.1); }
        .btn-off:hover { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.1); }

        .char-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; padding: 20px; background: rgba(0,0,0,0.5); }
        .char-grid.active { display: grid; }

        .char-item { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .char-thumb { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 1.5px solid #444; }
        
        .char-name-box { display: flex; flex-direction: column; font-size: 0.8rem; flex: 1; }
        .tag-row { display: flex; gap: 4px; margin-top: 3px; }
        .tier-tag { font-size: 0.65rem; font-weight: bold; padding: 1px 5px; border-radius: 3px; }
        .tag-ssr { background: var(--ssr); color: black; } .tag-sr { background: #555; color: white; }
        
        .role-tag { font-size: 0.65rem; padding: 1px 5px; border-radius: 3px; color: white; font-weight: bold; }
        .role-atk { background: var(--atk); } .role-def { background: var(--def); } .role-sup { background: var(--sup); color: black; }
        
        .role-chess { padding: 2px 8px; border: 1px solid rgba(255,255,255,0.2); text-shadow: 0 0 3px #000; }
        .role-chess.수호 { background: #004d66; color: var(--c-guard); border-color: var(--c-guard); box-shadow: 0 0 5px var(--c-guard); }
        .role-chess.투쟁 { background: #661a00; color: var(--c-struggle); border-color: var(--c-struggle); box-shadow: 0 0 5px var(--c-struggle); }
        .role-chess.영지 { background: #3d0066; color: var(--c-territory); border-color: var(--c-territory); box-shadow: 0 0 5px var(--c-territory); }
        .role-chess.흉성 { background: #66003d; color: var(--c-star); border-color: var(--c-star); box-shadow: 0 0 5px var(--c-star); }
        .role-chess.축복 { background: #1a6600; color: var(--c-bless); border-color: var(--c-bless); box-shadow: 0 0 5px var(--c-bless); }

        .btn-gen {
            display: block; width: 280px; padding: 18px; margin: 30px auto 0;
            background: linear-gradient(135deg, var(--chaos), #ff8c00);
            border: none; border-radius: 50px; font-weight: bold; font-size: 1.3rem;
            cursor: pointer; box-shadow: 0 0 25px rgba(255,215,0,0.3); color: black; transition: 0.3s;
        }

        .result-area { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 40px; }
        .card { width: 170px; background: #151518; border-radius: 15px; overflow: hidden; border-bottom: 4px solid #444; text-align: center; padding-bottom: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        
        .card img.profile { 
            width: 170px; height: 230px; 
            object-fit: cover; 
            object-position: center 15%; 
            border-bottom: 1px solid #333; 
        }

        .card-name { font-weight: bold; font-size: 1rem; margin-top: 10px; }
        .card-role-box { display: flex; justify-content: center; gap: 6px; margin-top: 6px; min-height: 22px; }
        .card-faction { font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; opacity: 0.9; }
        .faction-icon-card { width: 42px; height: 42px; }

        /* 행운의 각성체 모드일 때 카드를 조금 더 크고 화려하게 표시 (선택사항) */
        .card.lucky-card {
            transform: scale(1.1);
            box-shadow: 0 15px 45px rgba(255, 215, 0, 0.4);
            margin-top: 20px;
        }
    </style>
</head>

                {n:'리즈', r:'공격형', t:'SSR', i:'망각전야이미지폴더/image_ddf5b8.png', i_gen:'일반이미지폴더/gen_ddf5b8.png'},
                {n:'젠킨', r:'공격형', t:'SSR', i:'망각전야이미지폴더/image_ddf93e.png', i_gen:'일반이미지폴더/gen_ddf93e.png'},
                {n:'다포닐', r:'공격형', t:'SSR', i:'망각전야이미지폴더/image_ddf89b.png', i_gen:'일반이미지폴더/gen_ddf89b.png'},
                {n:'폴룩스', r:'공격형', t:'SSR', i:'망각전야이미지폴더/image_ddfd39.png', i_gen:'일반이미지폴더/gen_ddfd39.png'},

                {n:'카스토르', r:'방어형', t:'SSR', i:'망각전야이미지폴더/image_ddfc45.png', i_gen:'일반이미지폴더/gen_ddfc45.png'},
                {n:'틴커트', r:'보조형', t:'SSR', i:'망각전야이미지폴더/image_ddf8bb.png', i_gen:'일반이미지폴더/gen_ddf8bb.png'},
                {n:'카시아', r:'보조형', t:'SSR', i:'망각전야이미지폴더/image_ddf998.png', i_gen:'일반이미지폴더/gen_ddf998.png'},
                {n:'오를라', r:'보조형', t:'SSR', i:'망각전야이미지폴더/image_ddf91e.png', i_gen:'일반이미지폴더/gen_ddf91e.png'},
                {n:'클레멘타인', r:'보조형', t:'SSR', i:'망각전야이미지폴더/image_ddfd1b.png', i_gen:'일반이미지폴더/gen_ddfd1b.png', i_hidden:'일반이미지폴더/hidden_edfd1b.png'}
            ]
        }
    };

    function saveSettings() {
        const checked = Array.from(document.querySelectorAll('.chk')).map(el => ({ n: el.dataset.n, c: el.checked }));
        localStorage.setItem('morimens_final_data_v17', JSON.stringify(checked));
    }

    function loadSettings() {
        const saved = JSON.parse(localStorage.getItem('morimens_final_data_v17'));
        if (saved) saved.forEach(item => { const el = document.querySelector(`.chk[data-n="${item.n}"]`); if (el) el.checked = item.c; });
    }

    function updateView() {
        const style = document.querySelector('input[name="img_style"]:checked').value;
        document.querySelectorAll('.chk').forEach(el => {
            const char = el.closest('.char-item');
            const img = char.querySelector('.char-thumb');
            const data = findCharData(el.dataset.n);
            if(data) img.src = style === 'casual' ? data.i : data.i_gen;
        });
    }

    function findCharData(name) {
        for(let f in characterData) {
            let found = characterData[f].list.find(c => c.n === name);
            if(found) return found;
        }
    }

    function getRoleTag(role) {
        const cls = (role === '공격형') ? 'role-atk' : (role === '방어형' || role === '수비형') ? 'role-def' : 'role-sup';
        return `<span class="role-tag ${cls}">${role}</span>`;
    }

    function renderUI() {
        const mixType = document.querySelector('input[name="mix_type"]:checked').value;
        const style = document.querySelector('input[name="img_style"]:checked').value;
        const accordion = document.getElementById('accordion-container');
        
        saveSettings();
        accordion.innerHTML = '';

        if (mixType === 'chess') {
            for (const role in chessRoles) {
                const config = chessUiData[role];
                const charNames = chessRoles[role];
                const chars = charNames.map(name => findCharData(name)).filter(Boolean);

                const section = document.createElement('div');
                section.className = 'faction-accordion';
                section.innerHTML = `
                    <div class="faction-header" onclick="toggleFaction(this)">
                        <div class="faction-info" style="color:${config.c}">
                            <span style="font-size:1.3rem; margin-right:5px;">${config.i}</span> ${role}
                        </div>
                        <div class="btn-toggle-group">
                            <button class="btn-toggle btn-on" style="color:${config.c}" onclick="toggleAll('${role}', true, event)">전체 활성</button>
                            <button class="btn-toggle btn-off" onclick="toggleAll('${role}', false, event)">해제</button>
                        </div>
                    </div>
                    <div class="char-grid" id="grid-${role}">
                        ${chars.map(c => `
                            <label class="char-item">
                                <!-- 사야 포함 모든 캐릭터 기본 활성화 (checked) -->
                                <input type="checkbox" class="chk chk-${role}" data-n="${c.n}" checked onchange="saveSettings()">
                                <img src="${style === 'casual' ? c.i : c.i_gen}" class="char-thumb">
                                <div class="char-name-box">
                                    <span>${c.n}</span>
                                    <div class="tag-row">
                                        <span class="tier-tag ${c.t === 'SSR' ? 'tag-ssr' : 'tag-sr'}">${c.t}</span>
                                        <span class="role-tag role-chess ${role}">${role}</span>
                                    </div>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                `;
                accordion.appendChild(section);
            }
        } else {
            // 1계역, 2계역, 행운의 각성체 모드일 경우 계역 기준으로 표시
            for (const f in characterData) {
                const config = characterData[f];
                const section = document.createElement('div');
                section.className = 'faction-accordion';
                section.innerHTML = `
                    <div class="faction-header" onclick="toggleFaction(this)">
                        <div class="faction-info" style="color:${config.color}">
                            <img src="${config.icon}" class="faction-icon-small"> ${f}
                        </div>
                        <div class="btn-toggle-group">
                            <button class="btn-toggle btn-on" style="color:${config.color}" onclick="toggleAll('${f}', true, event)">전체 활성</button>
                            <button class="btn-toggle btn-off" onclick="toggleAll('${f}', false, event)">해제</button>
                        </div>
                    </div>
                    <div class="char-grid" id="grid-${f}">
                        ${config.list.map(c => `
                            <label class="char-item">
                                <!-- 사야 포함 모든 캐릭터 기본 활성화 (checked) -->
                                <input type="checkbox" class="chk chk-${f}" data-f="${f}" data-n="${c.n}" data-t="${c.t}" data-r="${c.r}" checked onchange="saveSettings()">
                                <img src="${style === 'casual' ? c.i : c.i_gen}" class="char-thumb">
                                <div class="char-name-box">
                                    <span>${c.n}</span>
                                    <div class="tag-row">
                                        <span class="tier-tag ${c.t === 'SSR' ? 'tag-ssr' : 'tag-sr'}">${c.t}</span>
                                        ${getRoleTag(c.r)}
                                    </div>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                `;
                accordion.appendChild(section);
            }
        }
        loadSettings();
    }

    function toggleFaction(header) { header.nextElementSibling.classList.toggle('active'); }
    function toggleAll(groupClass, s, e) {
        e.stopPropagation();
        document.querySelectorAll(`.chk-${groupClass}`).forEach(el => el.checked = s);
        saveSettings();
    }

    function makeTeam() {
        document.body.style.backgroundImage = 'url(망각전야이미지폴더/image_dec78e.jpg)';
        const mixType = document.querySelector('input[name="mix_type"]:checked').value;
        const style = document.querySelector('input[name="img_style"]:checked').value;
        const res = document.getElementById('result');
        res.innerHTML = '';

        // 이스터에그 0.5% 확률 (행운 모드에서는 1개, 나머지는 4개 생성)
        if (Math.random() < 0.005) { 
            document.body.style.backgroundImage = 'url(망각전야이미지폴더/Easter_egg3.png)';
            let loopCount = (mixType === 'lucky') ? 1 : 4;
            for(let i=0; i<loopCount; i++) {
                res.innerHTML += `
                    <div class="card ${mixType === 'lucky' ? 'lucky-card' : ''}" style="border-bottom: 4px solid #ffffff">
                        <img src="망각전야이미지폴더/Easter_egg1.png" class="profile">
                        <div class="card-name">작은석탄공</div>
                        <div class="card-role-box"><span class="tier-tag tag-ssr">SSR</span><span class="role-tag" style="background:#fff; color:#000;">모스단짝</span></div>
                        <div class="card-faction" style="color:#ffffff"><img src="망각전야이미지폴더/Easter_egg2.png" class="faction-icon-card"> 수호자</div>
                    </div>`;
            }
            return;
        }

        let team = [];

        if (mixType === 'chess') {
            const checkedNames = Array.from(document.querySelectorAll('.chk:checked')).map(el => el.dataset.n);
            const rolesPool = Object.keys(chessRoles).sort(() => 0.5 - Math.random());
            for (let role of rolesPool) {
                if (team.length >= 4) break;
                let roleChars = chessRoles[role].filter(name => checkedNames.includes(name));
                if (roleChars.length > 0) {
                    let pickedName = roleChars[Math.floor(Math.random() * roleChars.length)];
                    for(let f in characterData) {
                        let found = characterData[f].list.find(c => c.n === pickedName);
                        if(found) { team.push({...found, f: f, chessRole: role}); break; }
                    }
                }
            }
            if (team.length < 4) return alert("캐릭터가 부족합니다. (4가지 역할군 필요)");

        } else if (mixType === 'lucky') {
            // ⭐ 신규 추가: 행운의 각성체 모드 (모든 체크된 캐릭터 중 단 1명만 무작위로 선택)
            const availableFactions = Object.keys(characterData).filter(f => document.querySelectorAll(`.chk-${f}:checked`).length > 0);
            if (availableFactions.length === 0) return alert("각성체를 1명 이상 선택해주세요!");
            
            let pool = [];
            availableFactions.forEach(f => {
                pool.push(...Array.from(document.querySelectorAll(`.chk-${f}:checked`)).map(el => ({ n: el.dataset.n, f: el.dataset.f, t: el.dataset.t, r: el.dataset.r })));
            });
            
            if (pool.length < 1) return alert("캐릭터가 없습니다.");
            
            let picked = pool[Math.floor(Math.random() * pool.length)];
            team.push(picked);

        } else {
            // 기본 1계역, 2계역 모드
            const availableFactions = Object.keys(characterData).filter(f => document.querySelectorAll(`.chk-${f}:checked`).length > 0);
            if (availableFactions.length === 0) return alert("각성체를 선택해주세요!");
            let pool = [];
            let numF = parseInt(mixType) || (Math.random() < 0.5 ? 1 : 2);
            numF = Math.min(numF, availableFactions.length);
            const pickedF = [...availableFactions].sort(() => 0.5 - Math.random()).slice(0, numF);
            pickedF.forEach(f => {
                pool.push(...Array.from(document.querySelectorAll(`.chk-${f}:checked`)).map(el => ({ n: el.dataset.n, f: el.dataset.f, t: el.dataset.t, r: el.dataset.r })));
            });
            if (pool.length < 4) return alert("캐릭터가 부족합니다.");
            let attempts = 0;
            while (team.length < 4 && attempts < 1000) {
                let p = pool[Math.floor(Math.random() * pool.length)];
                if (!team.some(t => t.n === p.n)) {
                    if (p.n.includes('라모나') && team.some(t => t.n.includes('라모나'))) { attempts++; continue; }
                    team.push(p);
                }
                attempts++;
            }
        }

        // 결과 화면 출력
        team.forEach(t => {
            const config = characterData[t.f];
            const charInfo = findCharData(t.n);
            let finalImg = style === 'casual' ? charInfo.i : charInfo.i_gen;
            
            if (charInfo.i_hidden && Math.random() < 0.05) {
                finalImg = charInfo.i_hidden;
            }

            let roleTagHTML = (mixType === 'chess') ? `<span class="role-tag role-chess ${t.chessRole}">${t.chessRole}</span>` : getRoleTag(t.r);
            
            // 행운 모드일 경우 카드에 추가 효과(크게 보이기 등)
            let extraClass = (mixType === 'lucky') ? 'lucky-card' : '';

            res.innerHTML += `
                <div class="card ${extraClass}" style="border-bottom: 4px solid ${config.color}">
                    <img src="${finalImg}" class="profile" onerror="this.src='https://via.placeholder.com/170x230?text=No+Image'">
                    <div class="card-name">${t.n}</div>
                    <div class="card-role-box">
                        <span class="tier-tag ${t.t === 'SSR' ? 'tag-ssr' : 'tag-sr'}">${t.t}</span>
                        ${roleTagHTML}
                    </div>
                    <div class="card-faction" style="color:${config.color}">
                        <img src="${config.icon}" class="faction-icon-card"> ${t.f}
                    </div>
                </div>`;
        });
    }

    window.onload = renderUI;
</script>

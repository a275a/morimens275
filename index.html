<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>망각전야 랜덤 팀 편성기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Orbitron:wght@500&display=swap');
        
        :root {
            --chaos: #ffd700; --deep: #00f2ff; --blood: #ff3c3c; --hyper: #da70d6;
            --ssr: #ff8c00; --sr: #c0c0c0;
            --atk: #ff4444; --def: #4488ff; --sup: #44ff88;
            /* 체스 고유 역할군 색상 */
            --c-guard: #00e5ff; --c-struggle: #ff4d4d; --c-territory: #bf80ff; --c-star: #ff66cc; --c-bless: #66ff66;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: url('망각전야이미지폴더/image_dec78e.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); z-index: -1;
        }

        header { text-align: center; padding: 30px 20px; }
        .logo { max-width: 280px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }

        .container { width: 95%; max-width: 1100px; padding: 10px; margin-bottom: 50px; }

        .control-panel {
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .settings-row { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 25px; }
        .setting-group { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px solid #333; flex: 1; min-width: 300px; }
        .setting-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; color: var(--chaos); display: block; }

        .mode-selector, .style-selector { display: flex; gap: 10px; flex-wrap: wrap; }
        .mode-selector label, .style-selector label {
            cursor: pointer; padding: 10px 15px; background: #222; border: 1px solid #444;
            border-radius: 8px; transition: 0.3s; font-size: 0.85rem; flex: 1; text-align: center; min-width: 80px;
        }
        .mode-selector input, .style-selector input { display: none; }
        .mode-selector label:has(input:checked), .style-selector label:has(input:checked) { 
            border-color: var(--chaos); background: rgba(255,215,0,0.15); color: var(--chaos); font-weight: bold;
        }

        .faction-accordion { margin-bottom: 15px; border-radius: 12px; overflow: hidden; border: 1px solid #444; }
        .faction-header {
            background: #1a1a1e; padding: 15px 25px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
        }
        .faction-header:hover { background: #25252b; }
        .faction-info { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; font-weight: bold; }
        .faction-icon-small { width: 28px; height: 28px; }

        .btn-toggle-group { display: flex; gap: 10px; }
        .btn-toggle { 
            background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid #666; 
            padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: 0.2s;
        }
        .btn-on { border-color: currentColor; background: rgba(255,255,255,0.1); }
        .btn-off:hover { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.1); }

        .char-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; padding: 20px; background: rgba(0,0,0,0.5); }
        .char-grid.active { display: grid; }

        .char-item { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .char-thumb { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 1.5px solid #444; }
        
        .char-name-box { display: flex; flex-direction: column; font-size: 0.8rem; flex: 1; word-break: keep-all; }
        .tag-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
        .tier-tag { font-size: 0.65rem; font-weight: bold; padding: 1px 5px; border-radius: 3px; height: fit-content; }
        .tag-ssr { background: var(--ssr); color: black; } .tag-sr { background: #555; color: white; }
        
        .role-tag { font-size: 0.65rem; padding: 1px 5px; border-radius: 3px; color: white; font-weight: bold; height: fit-content; }
        .role-atk { background: var(--atk); } .role-def { background: var(--def); } .role-sup { background: var(--sup); color: black; }
        
        .role-chess { padding: 2px 8px; border: 1px solid rgba(255,255,255,0.2); text-shadow: 0 0 3px #000; height: fit-content; }
        .role-chess.수호 { background: #004d66; color: var(--c-guard); border-color: var(--c-guard); box-shadow: 0 0 5px var(--c-guard); }
        .role-chess.투쟁 { background: #661a00; color: var(--c-struggle); border-color: var(--c-struggle); box-shadow: 0 0 5px var(--c-struggle); }
        .role-chess.영지 { background: #3d0066; color: var(--c-territory); border-color: var(--c-territory); box-shadow: 0 0 5px var(--c-territory); }
        .role-chess.흉성 { background: #66003d; color: var(--c-star); border-color: var(--c-star); box-shadow: 0 0 5px var(--c-star); }
        .role-chess.축복 { background: #1a6600; color: var(--c-bless); border-color: var(--c-bless); box-shadow: 0 0 5px var(--c-bless); }

        .pin-selector {
            background: rgba(0,0,0,0.7); color: white; border: 1px solid #555;
            border-radius: 5px; font-size: 0.75rem; padding: 2px; cursor: pointer;
            margin-right: 5px; width: 65px;
        }
        .pin-selector:focus { outline: none; border-color: var(--chaos); }
        .pin-selector option { background: #1a1a1e; color: white; }
        .char-item.is-pinned { border-color: var(--chaos); background: rgba(255,215,0,0.1); }
        .char-item.is-random { border-color: #555; background: rgba(255,255,255,0.1); }

        .btn-gen {
            display: block; width: 280px; padding: 18px; margin: 30px auto 0;
            background: linear-gradient(135deg, var(--chaos), #ff8c00);
            border: none; border-radius: 50px; font-weight: bold; font-size: 1.3rem;
            cursor: pointer; box-shadow: 0 0 25px rgba(255,215,0,0.3); color: black; transition: 0.3s;
        }

        .result-area { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 40px; }
        .card { width: 170px; background: #151518; border-radius: 15px; overflow: hidden; border-bottom: 4px solid #444; text-align: center; padding-bottom: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        
        .card img.profile { 
            width: 170px; height: 230px; 
            object-fit: cover; 
            object-position: center 15%; 
            border-bottom: 1px solid #333; 
        }

        .card-name { font-weight: bold; font-size: 1rem; margin-top: 10px; }
        .card-role-box { display: flex; justify-content: center; gap: 6px; margin-top: 6px; min-height: 22px; }
        .card-faction { font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; opacity: 0.9; }
        .faction-icon-card { width: 42px; height: 42px; }

        .card.lucky-card {
            transform: scale(1.1);
            box-shadow: 0 15px 45px rgba(255, 215, 0, 0.4);
            margin-top: 20px;
        }
    </style>
</head>

                {n:'오를라', r:'보조형', t:'SSR', i:'망각전야이미지폴더/image_ddf91e.png', i_gen:'일반이미지폴더/gen_ddf91e.png'},
                {n:'클레멘타인', r:'보조형', t:'SSR', i:'망각전야이미지폴더/image_ddfd1b.png', i_gen:'일반이미지폴더/gen_ddfd1b.png', i_hidden:'일반이미지폴더/hidden_edfd1b.png'}
            ]
        }
    };

    const STORAGE_KEY = 'morimens_final_data_v24';

    function saveSettings() {
        const settings = Array.from(document.querySelectorAll('.pin-selector')).map(el => ({
            n: el.dataset.n,
            s: el.value
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    }

    function loadSettings() {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) {
            saved.forEach(item => {
                const el = document.querySelector(`.pin-selector[data-n="${item.n}"]`);
                if (el) {
                    el.value = item.s;
                    updateItemStyle(el);
                }
            });
        }
    }

    function updateItemStyle(selectEl) {
        const item = selectEl.closest('.char-item');
        item.classList.remove('is-pinned', 'is-random');
        if (selectEl.value === 'random') {
            item.classList.add('is-random');
        } else if (parseInt(selectEl.value) > 0) {
            item.classList.add('is-pinned');
        }
    }

    function updateView() {
        const style = document.querySelector('input[name="img_style"]:checked').value;
        document.querySelectorAll('.pin-selector').forEach(el => {
            const char = el.closest('.char-item');
            const img = char.querySelector('.char-thumb');
            const data = findCharData(el.dataset.n);
            if(data) img.src = style === 'casual' ? data.i : data.i_gen;
        });
    }

    // ⭐ 핵심 수정: 데이터를 찾을 때 계역(f) 정보를 무조건 포함하도록 보완
    function findCharData(name) {
        let charFound = null;
        let charFaction = '';
        for(let f in characterData) {
            charFound = characterData[f].list.find(c => c.n === name);
            if(charFound) {
                charFaction = f; // 계역 이름 저장
                break;
            }
        }
        if(!charFound) return null;

        let cRole = '';
        for(let role in chessRoles) { if(chessRoles[role].includes(name)) { cRole = role; break; } }
        
        // 계역(f) 정보를 합쳐서 반환
        return {...charFound, f: charFaction, chessRole: cRole};
    }

    function getRoleTag(role) {
        const cls = (role === '공격형') ? 'role-atk' : (role === '방어형' || role === '수비형') ? 'role-def' : 'role-sup';
        return `<span class="role-tag ${cls}">${role}</span>`;
    }

    function getPinSelectorHTML(name, groupClass) {
        return `
            <select class="pin-selector chk-${groupClass}" data-n="${name}" onchange="updateItemStyle(this); saveSettings()">
                <option value="0">해제</option>
                <option value="random" selected>랜덤</option>
                <option value="1">1번 고정</option>
                <option value="2">2번 고정</option>
                <option value="3">3번 고정</option>
                <option value="4">4번 고정</option>
            </select>
        `;
    }

    function renderUI() {
        const mixType = document.querySelector('input[name="mix_type"]:checked').value;
        const style = document.querySelector('input[name="img_style"]:checked').value;
        const accordion = document.getElementById('accordion-container');
        
        saveSettings();
        accordion.innerHTML = '';

        if (mixType === 'chess') {
            for (const role in chessRoles) {
                const config = chessUiData[role];
                const charNames = chessRoles[role];
                const chars = charNames.map(name => findCharData(name)).filter(Boolean);

                const section = document.createElement('div');
                section.className = 'faction-accordion';
                section.innerHTML = `
                    <div class="faction-header" onclick="toggleFaction(this)">
                        <div class="faction-info" style="color:${config.c}">
                            <span style="font-size:1.3rem; margin-right:5px;">${config.i}</span> ${role}
                        </div>
                        <div class="btn-toggle-group">
                            <button class="btn-toggle btn-on" style="color:${config.c}" onclick="toggleAll('${role}', 'random', event)">전체 랜덤</button>
                            <button class="btn-toggle btn-off" onclick="toggleAll('${role}', '0', event)">전체 해제</button>
                        </div>
                    </div>
                    <div class="char-grid active" id="grid-${role}">
                        ${chars.map(c => `
                            <label class="char-item is-random">
                                ${getPinSelectorHTML(c.n, role)}
                                <img src="${style === 'casual' ? c.i : c.i_gen}" class="char-thumb">
                                <div class="char-name-box">
                                    <span>${c.n}</span>
                                    <div class="tag-row">
                                        <span class="tier-tag ${c.t === 'SSR' ? 'tag-ssr' : 'tag-sr'}">${c.t}</span>
                                        <span class="role-tag role-chess ${role}">${role}</span>
                                    </div>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                `;
                accordion.appendChild(section);
            }
        } else {
            for (const f in characterData) {
                const config = characterData[f];
                const section = document.createElement('div');
                section.className = 'faction-accordion';
                section.innerHTML = `
                    <div class="faction-header" onclick="toggleFaction(this)">
                        <div class="faction-info" style="color:${config.color}">
                            <img src="${config.icon}" class="faction-icon-small"> ${f}
                        </div>
                        <div class="btn-toggle-group">
                            <button class="btn-toggle btn-on" style="color:${config.color}" onclick="toggleAll('${f}', 'random', event)">전체 랜덤</button>
                            <button class="btn-toggle btn-off" onclick="toggleAll('${f}', '0', event)">전체 해제</button>
                        </div>
                    </div>
                    <div class="char-grid active" id="grid-${f}">
                        ${config.list.map(c => `
                            <label class="char-item is-random">
                                ${getPinSelectorHTML(c.n, f)}
                                <img src="${style === 'casual' ? c.i : c.i_gen}" class="char-thumb">
                                <div class="char-name-box">
                                    <span>${c.n}</span>
                                    <div class="tag-row">
                                        <span class="tier-tag ${c.t === 'SSR' ? 'tag-ssr' : 'tag-sr'}">${c.t}</span>
                                        ${getRoleTag(c.r)}
                                    </div>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                `;
                accordion.appendChild(section);
            }
        }
        loadSettings();
    }

    function toggleFaction(header) { header.nextElementSibling.classList.toggle('active'); }

    function toggleAll(groupClass, s, e) {
        e.stopPropagation();
        document.querySelectorAll(`.chk-${groupClass}`).forEach(el => {
            el.value = s;
            updateItemStyle(el);
        });
        saveSettings();
    }

    function makeTeam() {
        document.body.style.backgroundImage = 'url(망각전야이미지폴더/image_dec78e.jpg)';
        const mixType = document.querySelector('input[name="mix_type"]:checked').value;
        const style = document.querySelector('input[name="img_style"]:checked').value;
        const res = document.getElementById('result');
        res.innerHTML = '';

        if (Math.random() < 0.005) { 
            document.body.style.backgroundImage = 'url(망각전야이미지폴더/Easter_egg3.png)';
            let loopCount = (mixType === 'lucky') ? 1 : 4;
            for(let i=0; i<loopCount; i++) {
                res.innerHTML += `
                    <div class="card ${mixType === 'lucky' ? 'lucky-card' : ''}" style="border-bottom: 4px solid #ffffff">
                        <img src="망각전야이미지폴더/Easter_egg1.png" class="profile">
                        <div class="card-name">작은석탄공</div>
                        <div class="card-role-box"><span class="tier-tag tag-ssr">SSR</span><span class="role-tag" style="background:#fff; color:#000;">모스단짝</span></div>
                        <div class="card-faction" style="color:#ffffff"><img src="망각전야이미지폴더/Easter_egg2.png" class="faction-icon-card"> 수호자</div>
                    </div>`;
            }
            return;
        }

        const allSelectors = Array.from(document.querySelectorAll('.pin-selector'));
        const finalTeam = [null, null, null, null];
        const randomPool = [];
        const usedNames = new Set();
        let fixedCount = 0;
        const fixedConstraintsByRole = {};

        for (const selector of allSelectors) {
            const name = selector.dataset.n;
            const state = selector.value;
            const charData = findCharData(name); // 이제 charData에 무조건 'f'(계역)가 들어있음

            if (state === '0' || !charData) continue;

            if (state === 'random') {
                randomPool.push(charData);
            } else {
                const pos = parseInt(state) - 1;
                if (finalTeam[pos]) {
                    alert(`${pos + 1}번 칸에 중복 고정된 각성체가 있습니다. (${finalTeam[pos].n}, ${name})\n한 칸에는 한 명만 고정해주세요.`);
                    return;
                }
                if (mixType === 'chess') {
                    const role = charData.chessRole;
                    if (fixedConstraintsByRole[role]) {
                        alert(`체스 모드에서는 고정된 멤버끼리 역할군이 중복될 수 없습니다. (${role} 중복)`);
                        return;
                    }
                    fixedConstraintsByRole[role] = true;
                }
                
                // 불필요한 계역 찾기 로직 삭제 (charData에 이미 있으므로)
                finalTeam[pos] = charData;
                usedNames.add(name);
                fixedCount++;
            }
        }

        if (mixType === 'lucky') {
            const luckyPool = [...randomPool];
            finalTeam.forEach(t => { if(t) luckyPool.push(t); });
            if (luckyPool.length === 0) return alert("각성체를 1명 이상 선택(랜덤 또는 고정)해주세요!");
            const picked = luckyPool[Math.floor(Math.random() * luckyPool.length)];
            renderCards([picked], 'lucky'); // 에러 발생하지 않음!
            return;
        }

        if (mixType === '1' || mixType === '2') {
            const fixedFactions = new Set();
            finalTeam.forEach(t => { if(t) fixedFactions.add(t.f); });
            if (fixedFactions.size > parseInt(mixType)) {
                alert(`현재 모드는 ${mixType}계역 편성 모드입니다. 고정된 각성체들의 계역 수가 모드 제한보다 많습니다. (${fixedFactions.size}개)`);
                return;
            }
        }

        const renderTeam = [...finalTeam];

        if (mixType === 'chess') {
            for (let i = 0; i < 4; i++) {
                if (renderTeam[i]) continue;
                let missingRole = '';
                for (let role in chessRoles) {
                    const roleUsed = renderTeam.some(t => t && (t.chessRole === role || chessRoles[role].includes(t.n)));
                    if (!roleUsed) {missingRole = role; break;}
                }
                if (!missingRole) break;

                let candidates = randomPool.filter(c => chessRoles[missingRole].includes(c.n) && !usedNames.has(c.n));
                if (candidates.length === 0) {
                    candidates = chessRoles[missingRole].map(name => findCharData(name)).filter(c => !usedNames.has(c.n));
                }
                if (candidates.length === 0) return alert("캐릭터가 부족하여 체스 룰을 맞출 수 없습니다. 다양한 역할군의 캐릭터를 랜덤으로 설정해주세요.");

                const picked = candidates[Math.floor(Math.random() * candidates.length)];
                
                // 불필요한 계역 찾기 로직 삭제
                renderTeam[i] = { ...picked, chessRole: missingRole };
                usedNames.add(picked.n);
            }
        } else {
            const fixedFactions = new Set();
            finalTeam.forEach(t => { if(t) fixedFactions.add(t.f); });
            let targetFactions = [...fixedFactions];
            const maxF = parseInt(mixType);
            
            if (targetFactions.length < maxF) {
                const poolFactions = [...new Set(randomPool.map(c => c.f))].filter(f => !fixedFactions.has(f));
                const needed = maxF - targetFactions.length;
                const shuffledF = poolFactions.sort(() => 0.5 - Math.random());
                targetFactions.push(...shuffledF.slice(0, needed));
            }
            
            let finalRandomPool = randomPool.filter(c => {
                if (usedNames.has(c.n)) return false;
                return targetFactions.includes(c.f);
            });

            for (let i = 0; i < 4; i++) {
                if (renderTeam[i]) continue;
                if (finalRandomPool.length === 0) return alert("캐릭터가 부족합니다. 랜덤 계역 모드에 맞는 캐릭터를 더 많이 '랜덤'으로 설정해주세요.");

                let attempts = 0;
                while (attempts < 100) {
                    const picked = finalRandomPool[Math.floor(Math.random() * finalRandomPool.length)];
                    if (picked.n.includes('라모나') && renderTeam.some(t => t && t.n.includes('라모나'))) {
                        attempts++; continue;
                    }

                    renderTeam[i] = picked;
                    usedNames.add(picked.n);
                    finalRandomPool = finalRandomPool.filter(c => c.n !== picked.n);
                    break;
                }
                if (!renderTeam[i]) return alert("캐릭터 편성 중 제약 조건(라모나 등)으로 인해 실패했습니다. 다시 시도하거나 조건을 완화해주세요.");
            }
        }

        renderCards(renderTeam, mixType);
    }

    function renderCards(team, mode) {
        const res = document.getElementById('result');
        const style = document.querySelector('input[name="img_style"]:checked').value;
        res.innerHTML = '';

        team.forEach(t => {
            if (!t) return;
            const config = characterData[t.f];
            let finalImg = style === 'casual' ? t.i : t.i_gen;
            
            if (t.i_hidden && Math.random() < 0.05) { finalImg = t.i_hidden; }

            let cRole = t.chessRole;
            if (!cRole) {
                for(let role in chessRoles) { if(chessRoles[role].includes(t.n)) { cRole = role; break; } }
            }

            let roleTagHTML = (mode === 'chess') ? `<span class="role-tag role-chess ${cRole}">${cRole}</span>` : getRoleTag(t.r);
            let extraClass = (mode === 'lucky') ? 'lucky-card' : '';

            res.innerHTML += `
                <div class="card ${extraClass}" style="border-bottom: 4px solid ${config.color}">
                    <img src="${finalImg}" class="profile" onerror="this.src='https://via.placeholder.com/170x230?text=No+Image'">
                    <div class="card-name">${t.n}</div>
                    <div class="card-role-box">
                        <span class="tier-tag ${t.t === 'SSR' ? 'tag-ssr' : 'tag-sr'}">${t.t}</span>
                        ${roleTagHTML}
                    </div>
                    <div class="card-faction" style="color:${config.color}">
                        <img src="${config.icon}" class="faction-icon-card"> ${t.f}
                    </div>
                </div>`;
        });
    }

    window.onload = renderUI;
</script>

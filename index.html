<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>망각전야 랜덤 팀 편성기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Orbitron:wght@500&display=swap');
        
        :root {
            --chaos: #ffd700; --deep: #00f2ff; --blood: #ff3c3c; --hyper: #da70d6;
            --ssr: #ff8c00; --sr: #c0c0c0;
            --atk: #ff4444; --def: #4488ff; --sup: #44ff88;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: url('망각전야이미지폴더/image_dec78e.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: -1;
        }

        header { text-align: center; padding: 30px 20px; }
        .logo { max-width: 280px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }

        .container { width: 95%; max-width: 1100px; padding: 10px; margin-bottom: 50px; }

        .control-panel {
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .settings-row { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 25px; }
        .setting-group { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px solid #333; flex: 1; min-width: 300px; }
        .setting-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; color: var(--chaos); display: block; }

        .mode-selector, .style-selector { display: flex; gap: 10px; }
        .mode-selector label, .style-selector label {
            cursor: pointer; padding: 8px 15px; background: #222; border: 1px solid #444;
            border-radius: 8px; transition: 0.3s; font-size: 0.85rem; flex: 1; text-align: center;
        }
        .mode-selector input, .style-selector input { display: none; }
        .mode-selector label:has(input:checked), .style-selector label:has(input:checked) { 
            border-color: var(--chaos); background: rgba(255,215,0,0.1); color: var(--chaos); font-weight: bold;
        }

        .faction-accordion { margin-bottom: 15px; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .faction-header {
            background: #1a1a1a; padding: 12px 20px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .faction-header:hover { background: #222; }
        .faction-info { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; font-weight: bold; }
        .faction-icon-small { width: 24px; height: 24px; }

        .btn-toggle-group { display: flex; gap: 5px; }
        .btn-toggle { 
            background: #333; color: #ccc; border: 1px solid #555; padding: 4px 10px; 
            border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: 0.2s;
        }
        .btn-toggle:hover { background: #444; color: white; }

        .char-grid {
            display: none; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px;
            padding: 20px; background: rgba(0,0,0,0.4);
        }
        .char-grid.active { display: grid; }

        .char-item {
            display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.03);
            padding: 6px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
        }
        .char-item:hover { background: rgba(255,255,255,0.08); border-color: #555; }
        .char-thumb { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #444; transition: 0.3s; }
        
        .char-name-box { display: flex; flex-direction: column; font-size: 0.75rem; flex: 1; }
        .tag-row { display: flex; gap: 3px; margin-top: 2px; }
        .tier-tag { font-size: 0.6rem; font-weight: bold; padding: 1px 4px; border-radius: 3px; }
        .tag-ssr { background: var(--ssr); color: black; } .tag-sr { background: #555; color: white; }
        
        .role-tag { font-size: 0.6rem; padding: 1px 4px; border-radius: 3px; color: white; }
        .role-atk { background: var(--atk); }
        .role-def { background: var(--def); }
        .role-sup { background: var(--sup); color: black; }

        .btn-gen {
            display: block; width: 260px; padding: 16px; margin: 30px auto 0;
            background: linear-gradient(135deg, var(--chaos), #ff8c00);
            border: none; border-radius: 50px; font-weight: bold; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0 0 20px rgba(255,215,0,0.3); color: black;
        }

        .result-area { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 40px; }
        .card { 
            width: 170px; background: #151518; border-radius: 15px; overflow: hidden; 
            border-bottom: 4px solid #444; text-align: center; padding-bottom: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card img.profile { width: 170px; height: 230px; object-fit: cover; border-bottom: 1px solid #333; transition: 0.5s; }
        .card-name { font-weight: bold; font-size: 0.95rem; margin-top: 10px; }
        
        .card-role-box { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }
        .card-faction { font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 4px; opacity: 0.8; }
        .faction-icon-card { width: 12px; height: 12px; }
    </style>
</head>

    function saveSettings() {
        const checked = Array.from(document.querySelectorAll('.chk')).map(el => ({ n: el.dataset.n, c: el.checked }));
        localStorage.setItem('morimens_v_final_v2', JSON.stringify(checked));
    }

    function loadSettings() {
        const saved = JSON.parse(localStorage.getItem('morimens_v_final_v2'));
        if (saved) saved.forEach(item => { const el = document.querySelector(`.chk[data-n="${item.n}"]`); if (el) el.checked = item.c; });
    }

    function updateView() {
        const style = document.querySelector('input[name="img_style"]:checked').value;
        document.querySelectorAll('.chk').forEach(el => {
            const char = el.closest('.char-item');
            const img = char.querySelector('.char-thumb');
            const data = findCharData(el.dataset.n);
            img.src = style === 'casual' ? data.i : data.i_gen;
        });
    }

    function findCharData(name) {
        for(let f in characterData) {
            let found = characterData[f].list.find(c => c.n === name);
            if(found) return found;
        }
    }

    function getRoleTag(role) {
        const roleCls = role === '공격형' ? 'role-atk' : (role === '방어형' || role === '수비형') ? 'role-def' : 'role-sup';
        return `<span class="role-tag ${roleCls}">${role}</span>`;
    }

    const container = document.getElementById('accordion-container');
    for (const f in characterData) {
        const config = characterData[f];
        const section = document.createElement('div');
        section.className = 'faction-accordion';
        section.innerHTML = `
            <div class="faction-header" onclick="toggleFaction(this)">
                <div class="faction-info" style="color:${config.color}">
                    <img src="${config.icon}" class="faction-icon-small"> ${f}
                </div>
                <div class="btn-toggle-group">
                    <button class="btn-toggle" onclick="toggleAll('${f}', true, event)">전체 활성</button>
                    <button class="btn-toggle" onclick="toggleAll('${f}', false, event)">해제</button>
                </div>
            </div>
            <div class="char-grid" id="grid-${f}">
                ${config.list.map(c => `
                    <label class="char-item">
                        <input type="checkbox" class="chk chk-${f}" data-f="${f}" data-n="${c.n}" data-t="${c.t}" data-r="${c.r}" checked onchange="saveSettings()">
                        <img src="${c.i}" class="char-thumb">
                        <div class="char-name-box">
                            <span>${c.n}</span>
                            <div class="tag-row">
                                <span class="tier-tag ${c.t === 'SSR' ? 'tag-ssr' : 'tag-sr'}">${c.t}</span>
                                ${getRoleTag(c.r)}
                            </div>
                        </div>
                    </label>
                `).join('')}
            </div>
        `;
        container.appendChild(section);
    }

    function toggleFaction(header) { header.nextElementSibling.classList.toggle('active'); }

    function toggleAll(f, s, e) {
        e.stopPropagation();
        document.querySelectorAll(`.chk-${f}`).forEach(el => el.checked = s);
        saveSettings();
    }

    function makeTeam() {
        const mixType = document.querySelector('input[name="mix_type"]:checked').value;
        const style = document.querySelector('input[name="img_style"]:checked').value;
        const availableFactions = Object.keys(characterData).filter(f => document.querySelectorAll(`.chk-${f}:checked`).length > 0);
        
        if (availableFactions.length === 0) return alert("각성체를 선택해주세요!");

        let pool = [];
        if (mixType === 'chess') {
            availableFactions.forEach(f => {
                pool.push(...Array.from(document.querySelectorAll(`.chk-${f}:checked`)).map(el => ({ n: el.dataset.n, f: el.dataset.f, t: el.dataset.t, r: el.dataset.r })));
            });
        } else {
            let numF = parseInt(mixType) || (Math.random() < 0.5 ? 1 : 2);
            numF = Math.min(numF, availableFactions.length);
            const pickedF = [...availableFactions].sort(() => 0.5 - Math.random()).slice(0, numF);
            pickedF.forEach(f => {
                pool.push(...Array.from(document.querySelectorAll(`.chk-${f}:checked`)).map(el => ({ n: el.dataset.n, f: el.dataset.f, t: el.dataset.t, r: el.dataset.r })));
            });
        }

        if (pool.length < 4) return alert("캐릭터가 부족합니다.");

        let team = [];
        let attempts = 0;
        while (team.length < 4 && attempts < 1000) {
            let p = pool[Math.floor(Math.random() * pool.length)];
            if (!team.some(t => t.n === p.n)) {
                if (p.n.includes('라모나') && team.some(t => t.n.includes('라모나'))) { attempts++; continue; }
                team.push(p);
            }
            attempts++;
        }

        const res = document.getElementById('result');
        res.innerHTML = '';
        team.forEach(t => {
            const config = characterData[t.f];
            const charInfo = findCharData(t.n);
            let finalImg = style === 'casual' ? charInfo.i : charInfo.i_gen;
            if (charInfo.i_hidden && Math.random() < 0.05) finalImg = charInfo.i_hidden;

            res.innerHTML += `
                <div class="card" style="border-bottom: 4px solid ${config.color}">
                    <img src="${finalImg}" class="profile" onerror="this.src='https://via.placeholder.com/170x230?text=No+Image'">
                    <div class="card-name">${t.n}</div>
                    <div class="card-role-box">
                        <span class="tier-tag ${t.t === 'SSR' ? 'tag-ssr' : 'tag-sr'}">${t.t}</span>
                        ${getRoleTag(t.r)}
                    </div>
                    <div class="card-faction" style="color:${config.color}">
                        <img src="${config.icon}" class="faction-icon-card"> ${t.f}
                    </div>
                </div>`;
        });
    }

    window.onload = loadSettings;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>망각전야 랜덤 팀 편성기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Orbitron:wght@500&display=swap');
        
        :root {
            --chaos: #ffd700; --deep: #00f2ff; --blood: #ff3c3c; --hyper: #da70d6;
            --ssr: #ff8c00; --sr: #c0c0c0;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: url('망각전야이미지폴더/image_dec78e.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: -1;
        }

        header { text-align: center; padding: 30px 20px; }
        .logo { max-width: 280px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }

        .container { width: 95%; max-width: 1100px; padding: 10px; margin-bottom: 50px; }

        .control-panel {
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .mode-selector {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .mode-selector label {
            cursor: pointer; padding: 10px 20px; background: rgba(0,0,0,0.5); border: 1px solid #444;
            border-radius: 10px; transition: 0.3s; font-size: 0.9rem;
        }
        .mode-selector input { display: none; }
        .mode-selector input:checked + span { color: var(--chaos); font-weight: bold; }
        .mode-selector label:has(input:checked) { border-color: var(--chaos); background: rgba(255,215,0,0.05); }

        /* 아코디언 UI */
        .faction-accordion { margin-bottom: 15px; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .faction-header {
            background: #1a1a1a; padding: 15px 25px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .faction-header:hover { background: #222; }
        .faction-info { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; font-weight: bold; }
        .faction-icon-small { width: 24px; height: 24px; }

        /* 전체 활성/비활성 버튼 세트 */
        .btn-toggle-group { display: flex; gap: 5px; }
        .btn-toggle { 
            background: #333; color: #ccc; border: 1px solid #555; padding: 4px 10px; 
            border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: 0.2s;
        }
        .btn-toggle:hover { background: #444; color: white; }

        .char-grid {
            display: none; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px;
            padding: 20px; background: rgba(0,0,0,0.4);
        }
        .char-grid.active { display: grid; }

        .char-item {
            display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.03);
            padding: 6px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
        }
        .char-item:hover { background: rgba(255,255,255,0.08); border-color: #555; }
        .char-thumb { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #444; }
        .char-name-box { display: flex; flex-direction: column; font-size: 0.75rem; }
        .tier-tag { font-size: 0.6rem; font-weight: bold; width: fit-content; padding: 1px 4px; border-radius: 3px; margin-top: 2px; }
        .tag-ssr { background: var(--ssr); color: black; } .tag-sr { background: #555; color: white; }

        /* 생성 버튼 */
        .btn-gen {
            display: block; width: 260px; padding: 16px; margin: 30px auto 0;
            background: linear-gradient(135deg, var(--chaos), #ff8c00);
            border: none; border-radius: 50px; font-weight: bold; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0 0 20px rgba(255,215,0,0.3); color: black;
        }

        /* 결과 영역 (이전 디자인 고정) */
        .result-area { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 40px; }
        .card { 
            width: 170px; background: #151518; border-radius: 15px; overflow: hidden; 
            border-bottom: 4px solid #444; text-align: center; padding-bottom: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card img.profile { width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid #333; }
        .card-name { font-weight: bold; font-size: 0.95rem; margin-top: 10px; }
        .card-faction { font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 4px; opacity: 0.8; }
        .faction-icon-card { width: 12px; height: 12px; }
    </style>
</head>
<body>

<header>
    <img src="망각전야이미지폴더/image_decaf2.png" alt="MORIMENS LOGO" class="logo">
</header>

<div class="container">
    <div class="control-panel">
        <div class="mode-selector">
            <label><input type="radio" name="mix_type" value="1" checked><span>1개 계역 조합</span></label>
            <label><input type="radio" name="mix_type" value="2"><span>2개 계역 조합</span></label>
            <label><input type="radio" name="mix_type" value="chess"><span>체스랜덤 (All Mix)</span></label>
        </div>

        <div id="accordion-container"></div>
        <button class="btn-gen" onclick="makeTeam()">TEAM DECODE</button>
    </div>
    <div id="result" class="result-area"></div>
</div>

<script>
    const characterData = {
        '혼돈': { icon: '망각전야이미지폴더/icon_chaos.png', color: '#ffd700',
            list: [
                {n:'회귀•라모나', t:'SSR', i:'망각전야이미지폴더/image_dd08da.png'}, {n:'융해•돌', t:'SSR', i:'망각전야이미지폴더/image_dd0c24.png'}, {n:'라이커', t:'SSR', i:'망각전야이미지폴더/image_dd0cdf.png'}, {n:'24', t:'SSR', i:'망각전야이미지폴더/image_dd0fe0.png'},
                {n:'노틸라', t:'SSR', i:'망각전야이미지폴더/image_dd103c.png'}, {n:'님피아', t:'SSR', i:'망각전야이미지폴더/image_dd1098.png'}, {n:'판디아', t:'SSR', i:'망각전야이미지폴더/image_dd10db.png'}, {n:'릴리', t:'SSR', i:'망각전야이미지폴더/image_dd13a5.png'},
                {n:'엘바', t:'SSR', i:'망각전야이미지폴더/image_dd13fc.png'}, {n:'카렌', t:'SSR', i:'망각전야이미지폴더/image_dd145e.png'}, {n:'타비', t:'SSR', i:'망각전야이미지폴더/image_dd6a98.png'}, {n:'카티구라', t:'SSR', i:'망각전야이미지폴더/image_dd6ad1.png'},
                {n:'모샤', t:'SSR', i:'망각전야이미지폴더/image_dd6d9a.png'}, {n:'하멜른', t:'SSR', i:'망각전야이미지폴더/image_dd6dd8.png'}, 
                {n:'라모나', t:'SR', i:'망각전야이미지폴더/image_dd6e33.png'}, {n:'돌', t:'SR', i:'망각전야이미지폴더/image_dd6e72.png'}, 
                {n:'오지에', t:'SR', i:'망각전야이미지폴더/image_dd6e98.png'}, {n:'로탄', t:'SR', i:'망각전야이미지폴더/image_dd715b.png'}
            ]
        },
        '심해': { icon: '망각전야이미지폴더/icon_deepsea.png', color: '#00f2ff',
            list: [
                {n:'탄망•머피', t:'SSR', i:'망각전야이미지폴더/image_dd7270.png'}, {n:'툴루', t:'SSR', i:'망각전야이미지폴더/image_dd7522.png'}, {n:'머피', t:'SSR', i:'망각전야이미지폴더/image_dd7577.png'}, {n:'파로스', t:'SSR', i:'망각전야이미지폴더/image_dd75db.png'},
                {n:'카이커', t:'SSR', i:'망각전야이미지폴더/image_dd7633.png'}, {n:'골리아', t:'SSR', i:'망각전야이미지폴더/image_dd791a.png'}, {n:'오레타', t:'SSR', i:'망각전야이미지폴더/image_dd795f.png'}, {n:'미리암', t:'SSR', i:'망각전야이미지폴더/image_dd799c.png'},
                {n:'산', t:'SSR', i:'망각전야이미지폴더/image_dd79da.png'}, {n:'셀레스트', t:'SSR', i:'망각전야이미지폴더/image_dd7cbb.png'}, {n:'코퍼산트', t:'SSR', i:'망각전야이미지폴더/image_dd845b.png'}, {n:'모스', t:'SSR', i:'망각전야이미지폴더/image_dd84a1.png'}
            ]
        },
        '혈육': { icon: '망각전야이미지폴더/icon_blood.png', color: '#ff3c3c',
            list: [
                {n:'혈쇄•시로', t:'SSR', i:'망각전야이미지폴더/image_dd88d6.png'}, {n:'타이스', t:'SSR', i:'망각전야이미지폴더/image_dd8c1f.png'}, {n:'살바도르', t:'SSR', i:'망각전야이미지폴더/image_dd8c59.png'}, {n:'아이기스', t:'SSR', i:'망각전야이미지폴더/image_dd8c7d.png'},
                {n:'소렐', t:'SSR', i:'망각전야이미지폴더/image_dd8c9b.png'}, {n:'시로', t:'SSR', i:'망각전야이미지폴더/image_dd8cbb.png'}, {n:'아그리파', t:'SSR', i:'망각전야이미지폴더/image_ddde3a.png'}, {n:'우부하시', t:'SSR', i:'망각전야이미지폴더/image_ddde7a.png'},
                {n:'레이아', t:'SSR', i:'망각전야이미지폴더/image_dddeb6.png'}, {n:'파인트', t:'SSR', i:'망각전야이미지폴더/image_ddded9.png'}, {n:'도어세인', t:'SSR', i:'망각전야이미지폴더/image_ddee54.png'}, {n:'픽맨', t:'SSR', i:'망각전야이미지폴더/image_ddf102.png'}, {n:'서', t:'SSR', i:'망각전야이미지폴더/image_ddf13f.png'}
            ]
        },
        '초차원': { icon: '망각전야이미지폴더/icon_hyper.png', color: '#da70d6',
            list: [
                {n:'리즈', t:'SSR', i:'망각전야이미지폴더/image_ddf5b8.png'}, {n:'다포닐', t:'SSR', i:'망각전야이미지폴더/image_ddf89b.png'}, {n:'틴커트', t:'SSR', i:'망각전야이미지폴더/image_ddf8bb.png'}, {n:'완다', t:'SSR', i:'망각전야이미지폴더/image_ddf8d9.png'},
                {n:'웬코르', t:'SSR', i:'망각전야이미지폴더/image_ddf8fd.png'}, {n:'오를라', t:'SSR', i:'망각전야이미지폴더/image_ddf91e.png'}, {n:'젠킨', t:'SSR', i:'망각전야이미지폴더/image_ddf93e.png'}, {n:'에리카', t:'SSR', i:'망각전야이미지폴더/image_ddf95e.png'},
                {n:'카시아', t:'SSR', i:'망각전야이미지폴더/image_ddf998.png'}, {n:'카스토르', t:'SSR', i:'망각전야이미지폴더/image_ddfc45.png'}, {n:'클레멘타인', t:'SSR', i:'망각전야이미지폴더/image_ddfd1b.png'}, {n:'풀룩스', t:'SSR', i:'망각전야이미지폴더/image_ddfd39.png'}
            ]
        }
    };

    function saveSettings() {
        const checked = Array.from(document.querySelectorAll('.chk')).map(el => ({ n: el.dataset.n, c: el.checked }));
        localStorage.setItem('morimens_vfinal', JSON.stringify(checked));
    }

    function loadSettings() {
        const saved = JSON.parse(localStorage.getItem('morimens_vfinal'));
        if (saved) saved.forEach(item => { const el = document.querySelector(`.chk[data-n="${item.n}"]`); if (el) el.checked = item.c; });
    }

    const container = document.getElementById('accordion-container');
    for (const f in characterData) {
        const config = characterData[f];
        const section = document.createElement('div');
        section.className = 'faction-accordion';
        section.innerHTML = `
            <div class="faction-header" onclick="toggleFaction(this)">
                <div class="faction-info" style="color:${config.color}">
                    <img src="${config.icon}" class="faction-icon-small"> ${f}
                </div>
                <div class="btn-toggle-group">
                    <button class="btn-toggle" onclick="toggleAll('${f}', true, event)">전체 활성</button>
                    <button class="btn-toggle" onclick="toggleAll('${f}', false, event)">해제</button>
                </div>
            </div>
            <div class="char-grid" id="grid-${f}">
                ${config.list.map(c => `
                    <label class="char-item">
                        <input type="checkbox" class="chk chk-${f}" data-f="${f}" data-n="${c.n}" data-t="${c.t}" data-i="${c.i}" checked onchange="saveSettings()">
                        <img src="${c.i}" class="char-thumb">
                        <div class="char-name-box">
                            <span>${c.n}</span>
                            <span class="tier-tag ${c.t === 'SSR' ? 'tag-ssr' : 'tag-sr'}">${c.t}</span>
                        </div>
                    </label>
                `).join('')}
            </div>
        `;
        container.appendChild(section);
    }

    function toggleFaction(header) {
        const grid = header.nextElementSibling;
        grid.classList.toggle('active');
        const iconDiv = header.querySelector('.btn-toggle-group').nextElementSibling;
    }

    function toggleAll(f, s, e) {
        e.stopPropagation(); // 아코디언이 닫히지 않게 방지
        document.querySelectorAll(`.chk-${f}`).forEach(el => el.checked = s);
        saveSettings();
    }

    function makeTeam() {
        const mixType = document.querySelector('input[name="mix_type"]:checked').value;
        const availableFactions = Object.keys(characterData).filter(f => document.querySelectorAll(`.chk-${f}:checked`).length > 0);
        if (availableFactions.length === 0) return alert("각성체를 선택해주세요!");

        let pool = [];
        if (mixType === 'chess') {
            availableFactions.forEach(f => {
                pool.push(...Array.from(document.querySelectorAll(`.chk-${f}:checked`)).map(el => ({ n: el.dataset.n, f: el.dataset.f, i: el.dataset.i, t: el.dataset.t })));
            });
        } else {
            let numF = parseInt(mixType);
            numF = Math.min(numF, availableFactions.length);
            const pickedF = [...availableFactions].sort(() => 0.5 - Math.random()).slice(0, numF);
            pickedF.forEach(f => {
                pool.push(...Array.from(document.querySelectorAll(`.chk-${f}:checked`)).map(el => ({ n: el.dataset.n, f: el.dataset.f, i: el.dataset.i, t: el.dataset.t })));
            });
        }

        if (pool.length < 4) return alert("캐릭터가 부족합니다.");

        let team = [];
        let attempts = 0;
        while (team.length < 4 && attempts < 1000) {
            let p = pool[Math.floor(Math.random() * pool.length)];
            if (!team.some(t => t.n === p.n)) {
                if (p.n.includes('라모나') && team.some(t => t.n.includes('라모나'))) { attempts++; continue; }
                team.push(p);
            }
            attempts++;
        }

        const res = document.getElementById('result');
        res.innerHTML = '';
        team.forEach(t => {
            const config = characterData[t.f];
            res.innerHTML += `
                <div class="card" style="border-bottom: 4px solid ${config.color}">
                    <img src="${t.i}" class="profile" onerror="this.src='https://via.placeholder.com/170x220?text=No+Image'">
                    <div class="card-name">${t.n} <span class="tier-tag ${t.t === 'SSR' ? 'tag-ssr' : 'tag-sr'}" style="font-size:0.5rem; position:relative; top:-2px;">${t.t}</span></div>
                    <div class="card-faction" style="color:${config.color}">
                        <img src="${config.icon}" class="faction-icon-card"> ${t.f}
                    </div>
                </div>`;
        });
    }

    window.onload = loadSettings;
</script>
</body>
</html>
